[project]
name = "task1-knowledge-brain"
version = "1.0.0"
description = "AI Tech Consultant - Knowledge Brain: RAG-powered product knowledge system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "aiosqlite>=0.20.0",
    "Pillow>=10.0.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.0.0",
    "xxhash>=3.0.0",
    "jinja2>=3.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
